<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師研習任務結算系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DotGothic16', sans-serif; background-color: #1a202c; color: #e2e8f0; }
        .rpg-box { background-color: #2d3748; border: 4px solid #4a5568; border-radius: 8px; box-shadow: 4px 4px 0px #000; }
        .rpg-input { background-color: #1a202c; border: 2px solid #4a5568; color: #63b3ed; padding: 0.5rem; width: 100%; border-radius: 4px; }
        .rpg-input:focus { outline: none; border-color: #63b3ed; }
        .rpg-btn { background-color: #4a5568; color: white; border: 2px solid #2d3748; padding: 0.5rem 1rem; cursor: pointer; box-shadow: 2px 2px 0px #000; transition: all 0.1s; }
        .rpg-btn:active { box-shadow: 0px 0px 0px #000; transform: translate(2px, 2px); }
        .rpg-btn-primary { background-color: #2b6cb0; border-color: #1a365d; }
        .step-section { display: none; }
        .step-section.active { display: block; }
        .rating-group { display: flex; gap: 0.5rem; justify-content: space-between; }
        .rating-group input[type="radio"] { display: none; }
        .rating-group label { flex: 1; text-align: center; background: #1a202c; border: 2px solid #4a5568; padding: 0.5rem 0; cursor: pointer; border-radius: 4px; }
        .rating-group input[type="radio"]:checked + label { background: #d69e2e; color: #1a202c; border-color: #b7791f; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6 rpg-box p-4">
        <h1 class="text-xl md:text-2xl text-yellow-500">📜 研習任務結算</h1>
        <div class="space-x-2">
            <button onclick="switchView('form')" class="rpg-btn">勇者填寫區</button>
            <button onclick="showAdminLogin()" class="rpg-btn">教師管理後台</button>
        </div>
    </div>

    <!-- 前台問卷區 (不變，為保持篇幅精簡，結構保留) -->
    <div id="formView" class="max-w-2xl mx-auto rpg-box p-6 md:p-8">
        <div class="mb-6 flex justify-between items-center text-sm text-gray-400 border-b border-gray-600 pb-4">
            <span id="progress-text">進度：第一章 (1/3)</span>
            <div class="w-1/2 bg-gray-700 h-4 rounded border border-gray-600">
                <div id="progress-bar" class="bg-yellow-500 h-full rounded w-1/3 transition-all"></div>
            </div>
        </div>
        <form id="surveyForm" onsubmit="event.preventDefault();">
            <div id="step1" class="step-section active">
                <h2 class="text-xl text-blue-300 mb-4">▶ 第一章：冒險者身分確認</h2>
                <div class="space-y-4">
                    <div><label class="block mb-1">勇者姓名 (必填)</label><input type="text" id="heroName" class="rpg-input" required placeholder="請輸入姓名"></div>
                    <div><label class="block mb-1">所屬單位</label><input type="text" id="school" class="rpg-input" placeholder="例如：光之王國中學"></div>
                    <div><label class="block mb-1">領域/科目</label>
                        <select id="subject" class="rpg-input">
                            <option value="">-- 選擇天賦 --</option>
                            <option value="國文">📜 國文</option><option value="英文">🗣️ 英文</option>
                            <option value="數學">🔢 數學</option><option value="自然">🧪 自然</option>
                            <option value="社會">🌍 社會</option><option value="科技">💻 科技</option>
                            <option value="藝能">🎨 藝能</option><option value="其他">⚔️ 其他</option>
                        </select>
                    </div>
                </div>
                <div class="mt-8 flex justify-end"><button type="button" onclick="nextStep(2)" class="rpg-btn rpg-btn-primary">下一步 ➡</button></div>
            </div>
            <div id="step2" class="step-section">
                <h2 class="text-xl text-green-300 mb-4">▶ 第二章：任務結算評分 (1最差 - 5最好)</h2>
                <div class="space-y-6">
                    <div><label class="block mb-2">內容實用度</label><div class="rating-group" id="rg-content">
                        <input type="radio" id="c1" name="ratingContent" value="1"><label for="c1">1</label>
                        <input type="radio" id="c2" name="ratingContent" value="2"><label for="c2">2</label>
                        <input type="radio" id="c3" name="ratingContent" value="3"><label for="c3">3</label>
                        <input type="radio" id="c4" name="ratingContent" value="4"><label for="c4">4</label>
                        <input type="radio" id="c5" name="ratingContent" value="5"><label for="c5">5</label>
                    </div></div>
                    <div><label class="block mb-2">講者專業度</label><div class="rating-group" id="rg-speaker">
                        <input type="radio" id="s1" name="ratingSpeaker" value="1"><label for="s1">1</label>
                        <input type="radio" id="s2" name="ratingSpeaker" value="2"><label for="s2">2</label>
                        <input type="radio" id="s3" name="ratingSpeaker" value="3"><label for="s3">3</label>
                        <input type="radio" id="s4" name="ratingSpeaker" value="4"><label for="s4">4</label>
                        <input type="radio" id="s5" name="ratingSpeaker" value="5"><label for="s5">5</label>
                    </div></div>
                    <div><label class="block mb-2">場地與設備</label><div class="rating-group" id="rg-venue">
                        <input type="radio" id="v1" name="ratingVenue" value="1"><label for="v1">1</label>
                        <input type="radio" id="v2" name="ratingVenue" value="2"><label for="v2">2</label>
                        <input type="radio" id="v3" name="ratingVenue" value="3"><label for="v3">3</label>
                        <input type="radio" id="v4" name="ratingVenue" value="4"><label for="v4">4</label>
                        <input type="radio" id="v5" name="ratingVenue" value="5"><label for="v5">5</label>
                    </div></div>
                    <p id="rating-error" class="text-red-400 text-sm hidden">⚠️ 請完成所有評分項目！</p>
                </div>
                <div class="mt-8 flex justify-between"><button type="button" onclick="prevStep(1)" class="rpg-btn">⬅ 上一步</button><button type="button" onclick="validateRatingsAndNext()" class="rpg-btn rpg-btn-primary">下一步 ➡</button></div>
            </div>
            <div id="step3" class="step-section">
                <h2 class="text-xl text-purple-300 mb-4">▶ 最終章：留下您的冒險紀載</h2>
                <div class="space-y-4">
                    <div><label class="block mb-1">最有幫助的部分？</label><textarea id="feedbackHelpful" class="rpg-input h-24"></textarea></div>
                    <div><label class="block mb-1">未來的建議？</label><textarea id="feedbackFuture" class="rpg-input h-24"></textarea></div>
                </div>
                <div class="mt-8 flex justify-between"><button type="button" onclick="prevStep(2)" class="rpg-btn">⬅ 上一步</button><button type="button" onclick="submitForm()" id="submitBtn" class="rpg-btn rpg-btn-primary bg-green-600 border-green-800">⚔️ 送出任務紀錄</button></div>
            </div>
            <div id="step4" class="step-section text-center py-10">
                <h2 class="text-3xl text-yellow-400 mb-4 animate-bounce">QUEST CLEARED!</h2>
                <p class="text-lg text-gray-300 mb-8">經驗值已大幅提升。</p><button type="button" onclick="location.reload()" class="rpg-btn">🔄 返回</button>
            </div>
        </form>
    </div>

    <!-- 管理者登入 -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="rpg-box p-6 max-w-sm w-full mx-4">
            <h3 class="text-xl text-yellow-400 mb-4">🔒 解鎖管理者權限</h3>
            <input type="password" id="adminPwd" class="rpg-input mb-4" placeholder="請輸入密碼">
            <p id="loginError" class="text-red-400 text-sm mb-4 hidden">密碼錯誤！</p>
            <div class="flex justify-end space-x-2">
                <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="rpg-btn">取消</button>
                <button onclick="checkAdminPassword()" id="loginBtn" class="rpg-btn rpg-btn-primary">解鎖</button>
            </div>
        </div>
    </div>

    <!-- 後台編輯視窗 (Modal) -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="rpg-box p-6 max-w-lg w-full mx-4 max-h-screen overflow-y-auto">
            <h3 class="text-xl text-yellow-400 mb-4">✏️ 編輯紀錄</h3>
            <input type="hidden" id="editRowId">
            <div class="space-y-3">
                <div><label class="block text-sm text-gray-400">姓名</label><input type="text" id="editName" class="rpg-input"></div>
                <div class="flex space-x-2">
                    <div class="w-1/2"><label class="block text-sm text-gray-400">單位</label><input type="text" id="editSchool" class="rpg-input"></div>
                    <div class="w-1/2"><label class="block text-sm text-gray-400">科目</label><input type="text" id="editSubject" class="rpg-input"></div>
                </div>
                <div class="flex justify-between space-x-2 text-center text-sm">
                    <div><label class="text-yellow-400">內容評分</label><input type="number" id="editRC" class="rpg-input text-center" min="1" max="5"></div>
                    <div><label class="text-green-400">講者評分</label><input type="number" id="editRS" class="rpg-input text-center" min="1" max="5"></div>
                    <div><label class="text-blue-400">場地評分</label><input type="number" id="editRV" class="rpg-input text-center" min="1" max="5"></div>
                </div>
                <div><label class="block text-sm text-gray-400">最有幫助的部分</label><textarea id="editFH" class="rpg-input h-16"></textarea></div>
                <div><label class="block text-sm text-gray-400">未來建議</label><textarea id="editFF" class="rpg-input h-16"></textarea></div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="closeEditModal()" class="rpg-btn">取消</button>
                <button onclick="saveEditData()" id="saveEditBtn" class="rpg-btn rpg-btn-primary bg-green-600">💾 儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 後台圖表與資料管理區 -->
    <div id="adminView" class="hidden max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="rpg-box p-4 bg-white"><canvas id="ratingChart"></canvas></div>
            <div class="rpg-box p-4 bg-white"><canvas id="subjectChart"></canvas></div>
        </div>
        
        <div class="rpg-box p-4 overflow-x-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl text-yellow-400">📋 任務紀錄清單</h2>
                <button onclick="exportToCSV()" class="rpg-btn rpg-btn-primary bg-purple-600 border-purple-800">📥 匯出 CSV 統計</button>
            </div>
            <div id="loadingText" class="text-center py-4">讀取資料中...請稍候...</div>
            <table class="w-full text-left border-collapse min-w-max hidden" id="dataTable">
                <thead>
                    <tr class="border-b-2 border-gray-600 text-gray-400">
                        <th class="p-2">時間</th><th class="p-2">姓名</th><th class="p-2">科目</th>
                        <th class="p-2">內容</th><th class="p-2">講者</th><th class="p-2">場地</th><th class="p-2">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 這裡填寫您最新部署的 Apps Script 網址
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwindH0YbFK3TTdDcDe29L1FN95ZeTYpHQAxhS9LXxRHPjzZJwJW31qP8BRsLu3ThPJ/exec';
        
        let ratingChartInstance = null;
        let subjectChartInstance = null;
        let adminDataCache = []; // 暫存撈下來的資料，用於匯出與編輯

        function switchView(view) {
            document.getElementById('formView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            if(view === 'form') document.getElementById('formView').classList.remove('hidden');
            else if (view === 'admin') document.getElementById('adminView').classList.remove('hidden');
        }

        function nextStep(step) {
            if(step === 2 && !document.getElementById('heroName').value) return alert("請填寫勇者姓名！");
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            const texts = ["第一章 (1/3)", "第二章 (2/3)", "最終章 (3/3)"];
            const percentages = ["33%", "66%", "100%"];
            if(step <= 3) {
                document.getElementById('progress-text').innerText = "進度：" + texts[step-1];
                document.getElementById('progress-bar').style.width = percentages[step-1];
            }
        }
        function prevStep(step) { nextStep(step); }

        function validateRatingsAndNext() {
            if(!document.querySelector('input[name="ratingContent"]:checked') || !document.querySelector('input[name="ratingSpeaker"]:checked') || !document.querySelector('input[name="ratingVenue"]:checked')) {
                document.getElementById('rating-error').classList.remove('hidden');
            } else {
                document.getElementById('rating-error').classList.add('hidden');
                nextStep(3);
            }
        }

        async function submitForm() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "⏳ 傳送中..."; btn.disabled = true;
            const payload = {
                name: document.getElementById('heroName').value, school: document.getElementById('school').value, subject: document.getElementById('subject').value,
                ratingContent: document.querySelector('input[name="ratingContent"]:checked')?.value || "", ratingSpeaker: document.querySelector('input[name="ratingSpeaker"]:checked')?.value || "", ratingVenue: document.querySelector('input[name="ratingVenue"]:checked')?.value || "",
                feedbackHelpful: document.getElementById('feedbackHelpful').value, feedbackFuture: document.getElementById('feedbackFuture').value
            };
            try {
                const res = await fetch(gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                if((await res.json()).result === 'success') {
                    document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
                    document.getElementById('step4').classList.add('active');
                }
            } catch (e) { alert("連線錯誤！"); btn.innerText = "⚔️ 送出任務紀錄"; btn.disabled = false; }
        }

        function showAdminLogin() { document.getElementById('loginModal').classList.remove('hidden'); document.getElementById('loginError').classList.add('hidden'); }

        async function checkAdminPassword() {
            const pwd = document.getElementById('adminPwd').value, btn = document.getElementById('loginBtn'), err = document.getElementById('loginError');
            btn.innerText = "驗證中..."; btn.disabled = true; err.classList.add('hidden');
            try {
                const res = await fetch(gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'verify_password', password: pwd }) });
                const resData = await res.json();
                if (resData.status === 'success') {
                    document.getElementById('loginModal').classList.add('hidden'); switchView('admin'); fetchAdminData();
                } else { err.innerText = resData.message || "密碼錯誤！"; err.classList.remove('hidden'); }
            } catch (error) { err.innerText = "連線失敗"; err.classList.remove('hidden'); }
            btn.innerText = "解鎖"; btn.disabled = false;
        }

        async function fetchAdminData() {
            document.getElementById('loadingText').classList.remove('hidden'); document.getElementById('dataTable').classList.add('hidden');
            try {
                const res = await fetch(gasUrl);
                adminDataCache = await res.json();
                renderTable(adminDataCache); renderCharts(adminDataCache);
                document.getElementById('loadingText').classList.add('hidden'); document.getElementById('dataTable').classList.remove('hidden');
            } catch (error) { document.getElementById('loadingText').innerText = "資料讀取失敗。"; }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if(data.length === 0) return tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">目前尚無紀錄</td></tr>';
            data.forEach(row => {
                const timeStr = row['時間戳記'] ? new Date(row['時間戳記']).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'numeric', minute:'numeric'}) : '';
                const tr = document.createElement('tr'); tr.className = 'border-b border-gray-700 hover:bg-gray-800';
                tr.innerHTML = `
                    <td class="p-2 whitespace-nowrap">${timeStr}</td>
                    <td class="p-2">${row['姓名'] || ''}</td>
                    <td class="p-2">${row['領域/科目'] || ''}</td>
                    <td class="p-2 text-yellow-400">${row['內容評分']}</td>
                    <td class="p-2 text-green-400">${row['講者評分']}</td>
                    <td class="p-2 text-blue-400">${row['場地評分']}</td>
                    <td class="p-2"><button onclick="openEditModal(${row.rowId})" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-xs">編輯</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ================= 編輯與匯出邏輯 =================
        function openEditModal(rowId) {
            const rowData = adminDataCache.find(r => r.rowId === rowId);
            if(!rowData) return;
            document.getElementById('editRowId').value = rowId;
            document.getElementById('editName').value = rowData['姓名'] || '';
            document.getElementById('editSchool').value = rowData['學校/單位'] || '';
            document.getElementById('editSubject').value = rowData['領域/科目'] || '';
            document.getElementById('editRC').value = rowData['內容評分'] || '';
            document.getElementById('editRS').value = rowData['講者評分'] || '';
            document.getElementById('editRV').value = rowData['場地評分'] || '';
            document.getElementById('editFH').value = rowData['最有幫助的部分'] || '';
            document.getElementById('editFF').value = rowData['未來建議'] || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveEditData() {
            const btn = document.getElementById('saveEditBtn');
            btn.innerText = "儲存中..."; btn.disabled = true;
            const payload = {
                action: 'edit_row',
                rowId: document.getElementById('editRowId').value,
                name: document.getElementById('editName').value, school: document.getElementById('editSchool').value, subject: document.getElementById('editSubject').value,
                ratingContent: document.getElementById('editRC').value, ratingSpeaker: document.getElementById('editRS').value, ratingVenue: document.getElementById('editRV').value,
                feedbackHelpful: document.getElementById('editFH').value, feedbackFuture: document.getElementById('editFF').value
            };
            try {
                const res = await fetch(gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                if((await res.json()).result === 'success') {
                    closeEditModal(); fetchAdminData(); // 成功後自動重整資料
                } else alert("儲存失敗！");
            } catch (e) { alert("連線錯誤！"); }
            btn.innerText = "💾 儲存修改"; btn.disabled = false;
        }

        function exportToCSV() {
            if(adminDataCache.length === 0) return alert("目前沒有資料可供匯出！");
            let csvContent = "\uFEFF"; // 加入 BOM 讓 Excel 支援中文
            csvContent += "時間,姓名,單位,科目,內容評分,講者評分,場地評分,最有幫助,未來建議\n";
            adminDataCache.forEach(row => {
                const escape = str => `"${(str||'').toString().replace(/"/g, '""')}"`; // 處理內含逗號或換行的文字
                const r = [ row['時間戳記'], row['姓名'], row['學校/單位'], row['領域/科目'], row['內容評分'], row['講者評分'], row['場地評分'], escape(row['最有幫助的部分']), escape(row['未來建議']) ];
                csvContent += r.join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `研習統計_${new Date().toLocaleDateString().replace(/\//g,'')}.csv`;
            link.click();
        }

        // 圖表繪製 (略微壓縮版)
        function renderCharts(data) {
            if(ratingChartInstance) ratingChartInstance.destroy();
            if(subjectChartInstance) subjectChartInstance.destroy();
            let [tc, ts, tv, count] = [0,0,0,0], subs = {};
            data.forEach(r => { 
                subs[r['領域/科目']||'未知'] = (subs[r['領域/科目']||'未知']||0)+1; 
                let c=parseInt(r['內容評分']), s=parseInt(r['講者評分']), v=parseInt(r['場地評分']);
                if(c) tc+=c; if(s) ts+=s; if(v) tv+=v; if(c&&s&&v) count++;
            });
            Chart.defaults.font.family = "'DotGothic16', sans-serif";
            ratingChartInstance = new Chart(document.getElementById('ratingChart').getContext('2d'), {
                type: 'bar',
                data: { labels: ['內容實用度', '講者專業度', '場地設備'], datasets: [{ label: '平均滿意度', data: count>0 ? [(tc/count).toFixed(1), (ts/count).toFixed(1), (tv/count).toFixed(1)] : [0,0,0], backgroundColor: ['#f6ad55', '#68d391', '#63b3ed'] }] },
                options: { scales: { y: { beginAtZero: true, max: 5 } } }
            });
            subjectChartInstance = new Chart(document.getElementById('subjectChart').getContext('2d'), {
                type: 'pie',
                data: { labels: Object.keys(subs), datasets: [{ data: Object.values(subs), backgroundColor: ['#fc8181', '#f6ad55', '#f6e05e', '#68d391', '#4fd1c5'] }] },
                options: { plugins: { title: { display: true, text: '參與者分佈' } } }
            });
        }
    </script>
</body>
</html>
