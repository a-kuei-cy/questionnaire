<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師研習任務結算系統</title>
    <!-- 引入 Tailwind CSS (CDN 顯示警告為正常現象，不影響運作) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js 用於後台圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入復古像素字體 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #1a202c; /* Tailwind gray-900 */
            color: #e2e8f0; /* Tailwind gray-200 */
        }
        .rpg-box {
            background-color: #2d3748;
            border: 4px solid #4a5568;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #000;
        }
        .rpg-input {
            background-color: #1a202c;
            border: 2px solid #4a5568;
            color: #63b3ed;
            padding: 0.5rem;
            width: 100%;
            border-radius: 4px;
        }
        .rpg-input:focus {
            outline: none;
            border-color: #63b3ed;
        }
        .rpg-btn {
            background-color: #4a5568;
            color: white;
            border: 2px solid #2d3748;
            padding: 0.5rem 1rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.1s;
        }
        .rpg-btn:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(2px, 2px);
        }
        .rpg-btn-primary {
            background-color: #2b6cb0;
            border-color: #1a365d;
        }
        .step-section {
            display: none;
        }
        .step-section.active {
            display: block;
        }
        /* 美化 radio 按鈕為按鈕形狀 */
        .rating-group { display: flex; gap: 0.5rem; justify-content: space-between; }
        .rating-group input[type="radio"] { display: none; }
        .rating-group label {
            flex: 1; text-align: center; background: #1a202c; border: 2px solid #4a5568;
            padding: 0.5rem 0; cursor: pointer; border-radius: 4px;
        }
        .rating-group input[type="radio"]:checked + label {
            background: #d69e2e; color: #1a202c; border-color: #b7791f; font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- 導覽列 -->
    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6 rpg-box p-4">
        <h1 class="text-xl md:text-2xl text-yellow-500">📜 研習任務結算</h1>
        <div class="space-x-2">
            <button onclick="switchView('form')" class="rpg-btn">勇者填寫區</button>
            <button onclick="showAdminLogin()" class="rpg-btn">教師管理後台</button>
        </div>
    </div>

    <!-- ================= 前台：問卷填寫區 ================= -->
    <div id="formView" class="max-w-2xl mx-auto rpg-box p-6 md:p-8">
        <!-- 步驟指示器 -->
        <div class="mb-6 flex justify-between items-center text-sm text-gray-400 border-b border-gray-600 pb-4">
            <span id="progress-text">進度：第一章 (1/3)</span>
            <div class="w-1/2 bg-gray-700 h-4 rounded border border-gray-600">
                <div id="progress-bar" class="bg-yellow-500 h-full rounded w-1/3 transition-all"></div>
            </div>
        </div>

        <form id="surveyForm" onsubmit="event.preventDefault();">
            <!-- 步驟 1：基本資料 -->
            <div id="step1" class="step-section active">
                <h2 class="text-xl text-blue-300 mb-4">▶ 第一章：冒險者身分確認</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block mb-1">勇者姓名 (必填)</label>
                        <input type="text" id="heroName" class="rpg-input" required placeholder="請輸入姓名">
                    </div>
                    <div>
                        <label class="block mb-1">所屬公會 (學校/單位)</label>
                        <input type="text" id="school" class="rpg-input" placeholder="例如：光之王國中學">
                    </div>
                    <div>
                        <label class="block mb-1">職業天賦 (領域/科目)</label>
                        <select id="subject" class="rpg-input">
                            <option value="">-- 選擇天賦 --</option>
                            <option value="國文">📜 國文 (咒術師)</option>
                            <option value="英文">🗣️ 英文 (翻譯官)</option>
                            <option value="數學">🔢 數學 (煉金術士)</option>
                            <option value="自然">🧪 自然 (元素使)</option>
                            <option value="社會">🌍 社會 (歷史學者)</option>
                            <option value="科技">💻 科技 (機甲師)</option>
                            <option value="藝能">🎨 藝能 (吟遊詩人)</option>
                            <option value="其他">⚔️ 其他</option>
                        </select>
                    </div>
                </div>
                <div class="mt-8 flex justify-end">
                    <button type="button" onclick="nextStep(2)" class="rpg-btn rpg-btn-primary">下一步：任務結算 ➡</button>
                </div>
            </div>

            <!-- 步驟 2：評分 -->
            <div id="step2" class="step-section">
                <h2 class="text-xl text-green-300 mb-4">▶ 第二章：任務結算評分 (1最差 - 5最好)</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block mb-2">本次研習內容的實用度？</label>
                        <div class="rating-group">
                            <input type="radio" id="c1" name="ratingContent" value="1"><label for="c1">1</label>
                            <input type="radio" id="c2" name="ratingContent" value="2"><label for="c2">2</label>
                            <input type="radio" id="c3" name="ratingContent" value="3"><label for="c3">3</label>
                            <input type="radio" id="c4" name="ratingContent" value="4"><label for="c4">4</label>
                            <input type="radio" id="c5" name="ratingContent" value="5"><label for="c5">5</label>
                        </div>
                    </div>
                    <div>
                        <label class="block mb-2">講師的專業度與表達？</label>
                        <div class="rating-group">
                            <input type="radio" id="s1" name="ratingSpeaker" value="1"><label for="s1">1</label>
                            <input type="radio" id="s2" name="ratingSpeaker" value="2"><label for="s2">2</label>
                            <input type="radio" id="s3" name="ratingSpeaker" value="3"><label for="s3">3</label>
                            <input type="radio" id="s4" name="ratingSpeaker" value="4"><label for="s4">4</label>
                            <input type="radio" id="s5" name="ratingSpeaker" value="5"><label for="s5">5</label>
                        </div>
                    </div>
                    <div>
                        <label class="block mb-2">場地與設備安排？</label>
                        <div class="rating-group">
                            <input type="radio" id="v1" name="ratingVenue" value="1"><label for="v1">1</label>
                            <input type="radio" id="v2" name="ratingVenue" value="2"><label for="v2">2</label>
                            <input type="radio" id="v3" name="ratingVenue" value="3"><label for="v3">3</label>
                            <input type="radio" id="v4" name="ratingVenue" value="4"><label for="v4">4</label>
                            <input type="radio" id="v5" name="ratingVenue" value="5"><label for="v5">5</label>
                        </div>
                    </div>
                    <p id="rating-error" class="text-red-400 text-sm hidden">⚠️ 系統提示：請完成所有評分項目！</p>
                </div>
                <div class="mt-8 flex justify-between">
                    <button type="button" onclick="prevStep(1)" class="rpg-btn">⬅ 上一步</button>
                    <button type="button" onclick="validateRatingsAndNext()" class="rpg-btn rpg-btn-primary">下一步：冒險心得 ➡</button>
                </div>
            </div>

            <!-- 步驟 3：回饋 -->
            <div id="step3" class="step-section">
                <h2 class="text-xl text-purple-300 mb-4">▶ 最終章：留下您的冒險紀載</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block mb-1">本次研習對您最有幫助的部分？</label>
                        <textarea id="feedbackHelpful" class="rpg-input h-24" placeholder="請描述..."></textarea>
                    </div>
                    <div>
                        <label class="block mb-1">未來希望開設什麼樣的研習？ (選填)</label>
                        <textarea id="feedbackFuture" class="rpg-input h-24" placeholder="給公會的建議..."></textarea>
                    </div>
                </div>
                <div class="mt-8 flex justify-between">
                    <button type="button" onclick="prevStep(2)" class="rpg-btn">⬅ 上一步</button>
                    <button type="button" onclick="submitForm()" id="submitBtn" class="rpg-btn rpg-btn-primary bg-green-600 border-green-800">⚔️ 送出任務紀錄</button>
                </div>
            </div>

            <!-- 步驟 4：完成畫面 -->
            <div id="step4" class="step-section text-center py-10">
                <h2 class="text-3xl text-yellow-400 mb-4 animate-bounce">QUEST CLEARED!</h2>
                <p class="text-lg text-gray-300 mb-8">感謝勇者提供寶貴的紀錄！<br>您的經驗值已大幅提升。</p>
                <button type="button" onclick="location.reload()" class="rpg-btn">🔄 返回登錄畫面</button>
            </div>
        </form>
    </div>

    <!-- ================= 後台：管理者密碼驗證框 ================= -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center">
        <div class="rpg-box p-6 max-w-sm w-full mx-4">
            <h3 class="text-xl text-yellow-400 mb-4">🔒 解鎖管理者權限</h3>
            <input type="password" id="adminPwd" class="rpg-input mb-4" placeholder="請輸入公會密碼">
            <p id="loginError" class="text-red-400 text-sm mb-4 hidden">密碼錯誤，拒絕存取！</p>
            <div class="flex justify-end space-x-2">
                <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="rpg-btn">取消</button>
                <button onclick="checkAdminPassword()" id="loginBtn" class="rpg-btn rpg-btn-primary">解鎖</button>
            </div>
        </div>
    </div>

    <!-- ================= 後台：圖表與資料管理區 ================= -->
    <div id="adminView" class="hidden max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- 評分長條圖 -->
            <div class="rpg-box p-4 bg-white">
                <canvas id="ratingChart"></canvas>
            </div>
            <!-- 科目圓餅圖 -->
            <div class="rpg-box p-4 bg-white">
                <canvas id="subjectChart"></canvas>
            </div>
        </div>
        
        <!-- 資料表格 -->
        <div class="rpg-box p-4 overflow-x-auto">
            <h2 class="text-xl text-yellow-400 mb-4">📋 任務紀錄清單</h2>
            <div id="loadingText" class="text-center py-4">讀取資料中...請稍候...</div>
            <table class="w-full text-left border-collapse min-w-max hidden" id="dataTable">
                <thead>
                    <tr class="border-b-2 border-gray-600 text-gray-400">
                        <th class="p-2">時間</th>
                        <th class="p-2">姓名</th>
                        <th class="p-2">科目</th>
                        <th class="p-2">內容</th>
                        <th class="p-2">講者</th>
                        <th class="p-2">場地</th>
                        <th class="p-2">回饋</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-sm">
                    <!-- 資料將透過 JS 塞入這裡 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ================= JavaScript 邏輯 ================= -->
    <script>
        // 【請確認此為您最新發布的 Apps Script 網址】
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwindH0YbFK3TTdDcDe29L1FN95ZeTYpHQAxhS9LXxRHPjzZJwJW31qP8BRsLu3ThPJ/exec';
        
        let ratingChartInstance = null;
        let subjectChartInstance = null;

        // --- 切換前台/後台畫面 ---
        function switchView(view) {
            document.getElementById('formView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            if(view === 'form') {
                document.getElementById('formView').classList.remove('hidden');
            } else if (view === 'admin') {
                document.getElementById('adminView').classList.remove('hidden');
            }
        }

        // --- 表單步驟控制 ---
        function nextStep(step) {
            if(step === 2) {
                const name = document.getElementById('heroName').value;
                if(!name) { alert("請填寫勇者姓名！"); return; }
            }
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            updateProgress(step);
        }

        function prevStep(step) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            updateProgress(step);
        }

        function updateProgress(step) {
            if(step > 3) return;
            const texts = ["第一章 (1/3)", "第二章 (2/3)", "最終章 (3/3)"];
            const percentages = ["33%", "66%", "100%"];
            document.getElementById('progress-text').innerText = "進度：" + texts[step-1];
            document.getElementById('progress-bar').style.width = percentages[step-1];
        }

        function validateRatingsAndNext() {
            const c = document.querySelector('input[name="ratingContent"]:checked');
            const s = document.querySelector('input[name="ratingSpeaker"]:checked');
            const v = document.querySelector('input[name="ratingVenue"]:checked');
            const err = document.getElementById('rating-error');
            
            if(!c || !s || !v) {
                err.classList.remove('hidden');
            } else {
                err.classList.add('hidden');
                nextStep(3);
            }
        }

        // --- 送出資料至 Google Apps Script ---
        async function submitForm() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "⏳ 傳送中...";
            btn.disabled = true;

            const formData = {
                name: document.getElementById('heroName').value,
                school: document.getElementById('school').value,
                subject: document.getElementById('subject').value,
                ratingContent: document.querySelector('input[name="ratingContent"]:checked')?.value || "",
                ratingSpeaker: document.querySelector('input[name="ratingSpeaker"]:checked')?.value || "",
                ratingVenue: document.querySelector('input[name="ratingVenue"]:checked')?.value || "",
                feedbackHelpful: document.getElementById('feedbackHelpful').value,
                feedbackFuture: document.getElementById('feedbackFuture').value
            };

            try {
                // 使用 text/plain 避免觸發 CORS Preflight OPTIONS
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if(result.result === 'success') {
                    document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
                    document.getElementById('step4').classList.add('active');
                } else {
                    alert("發生未知錯誤。");
                    btn.innerText = "⚔️ 送出任務紀錄";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert("網路連線錯誤，無法送出！");
                btn.innerText = "⚔️ 送出任務紀錄";
                btn.disabled = false;
            }
        }

        // --- 管理者登入驗證 ---
        function showAdminLogin() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('adminPwd').value = '';
        }

        async function checkAdminPassword() {
            const pwd = document.getElementById('adminPwd').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            
            btn.innerText = "驗證中...";
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                // 送出密碼讓 GAS 驗證
                const payload = { action: 'verify_password', password: pwd };
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();
                
                if (resData.status === 'success') {
                    document.getElementById('loginModal').classList.add('hidden');
                    switchView('admin');
                    fetchAdminData(); // 解鎖成功後讀取資料
                } else {
                    err.innerText = resData.message || "密碼錯誤！";
                    err.classList.remove('hidden');
                }
            } catch (error) {
                err.innerText = "連線失敗，請稍後再試。";
                err.classList.remove('hidden');
            }
            btn.innerText = "解鎖";
            btn.disabled = false;
        }

        // --- 讀取 GAS 資料庫繪製後台 ---
        async function fetchAdminData() {
            document.getElementById('loadingText').classList.remove('hidden');
            document.getElementById('dataTable').classList.add('hidden');
            
            try {
                const response = await fetch(gasUrl);
                const data = await response.json();
                
                renderTable(data);
                renderCharts(data);
                
                document.getElementById('loadingText').classList.add('hidden');
                document.getElementById('dataTable').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loadingText').innerText = "資料讀取失敗，請檢查連線。";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">目前尚無紀錄</td></tr>';
                return;
            }

            data.forEach(row => {
                // 將 GAS 回傳的時間字串稍微格式化
                const timeStr = row['時間戳記'] ? new Date(row['時間戳記']).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'numeric', minute:'numeric'}) : '';
                
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-700 hover:bg-gray-800';
                tr.innerHTML = `
                    <td class="p-2 whitespace-nowrap">${timeStr}</td>
                    <td class="p-2">${row['姓名'] || ''}</td>
                    <td class="p-2">${row['領域/科目'] || ''}</td>
                    <td class="p-2 text-yellow-400">★${row['內容評分'] || 0}</td>
                    <td class="p-2 text-green-400">★${row['講者評分'] || 0}</td>
                    <td class="p-2 text-blue-400">★${row['場地評分'] || 0}</td>
                    <td class="p-2 truncate max-w-xs" title="${row['最有幫助的部分'] || ''}">${row['最有幫助的部分'] || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCharts(data) {
            if(data.length === 0) return;

            // 統計評分平均
            let totalContent = 0, totalSpeaker = 0, totalVenue = 0;
            let subjectCounts = {};
            let validRatingCount = 0;

            data.forEach(row => {
                // 計算科目分佈
                const sub = row['領域/科目'] || '未填寫';
                subjectCounts[sub] = (subjectCounts[sub] || 0) + 1;
                
                // 計算評分
                const c = parseInt(row['內容評分']);
                const s = parseInt(row['講者評分']);
                const v = parseInt(row['場地評分']);
                if(!isNaN(c) && !isNaN(s) && !isNaN(v)) {
                    totalContent += c;
                    totalSpeaker += s;
                    totalVenue += v;
                    validRatingCount++;
                }
            });

            // 銷毀舊圖表以防重複渲染
            if(ratingChartInstance) ratingChartInstance.destroy();
            if(subjectChartInstance) subjectChartInstance.destroy();

            Chart.defaults.font.family = "'DotGothic16', sans-serif";

            // 繪製長條圖
            const ctxBar = document.getElementById('ratingChart').getContext('2d');
            ratingChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['內容實用度', '講者專業度', '場地設備'],
                    datasets: [{
                        label: '平均滿意度 (滿分5)',
                        data: validRatingCount > 0 ? [
                            (totalContent/validRatingCount).toFixed(1),
                            (totalSpeaker/validRatingCount).toFixed(1),
                            (totalVenue/validRatingCount).toFixed(1)
                        ] : [0,0,0],
                        backgroundColor: ['#f6ad55', '#68d391', '#63b3ed'],
                        borderColor: '#2d3748',
                        borderWidth: 2
                    }]
                },
                options: { scales: { y: { beginAtZero: true, max: 5 } } }
            });

            // 繪製圓餅圖
            const ctxPie = document.getElementById('subjectChart').getContext('2d');
            subjectChartInstance = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: Object.keys(subjectCounts),
                    datasets: [{
                        data: Object.values(subjectCounts),
                        backgroundColor: ['#fc8181', '#f6ad55', '#f6e05e', '#68d391', '#4fd1c5', '#63b3ed', '#b794f4', '#f687b3'],
                        borderWidth: 2,
                        borderColor: '#2d3748'
                    }]
                },
                options: { plugins: { title: { display: true, text: '參與者天賦分佈' } } }
            });
        }
    </script>
</body>
</html>
