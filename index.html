<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態研習任務系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DotGothic16', sans-serif; background-color: #1a202c; color: #e2e8f0; }
        .rpg-box { background-color: #2d3748; border: 4px solid #4a5568; border-radius: 8px; box-shadow: 4px 4px 0px #000; }
        .rpg-input { background-color: #1a202c; border: 2px solid #4a5568; color: #63b3ed; padding: 0.5rem; width: 100%; border-radius: 4px; }
        .rpg-btn { background-color: #4a5568; color: white; border: 2px solid #2d3748; padding: 0.5rem 1rem; cursor: pointer; box-shadow: 2px 2px 0px #000; }
        .rpg-btn:active { box-shadow: 0px 0px 0px #000; transform: translate(2px, 2px); }
        .rpg-btn-primary { background-color: #2b6cb0; border-color: #1a365d; }
        .step-section { display: none; }
        .step-section.active { display: block; }
        .rating-group { display: flex; gap: 0.5rem; justify-content: space-between; }
        .rating-group input[type="radio"] { display: none; }
        .rating-group label { flex: 1; text-align: center; background: #1a202c; border: 2px solid #4a5568; padding: 0.5rem 0; cursor: pointer; border-radius: 4px; }
        .rating-group input[type="radio"]:checked + label { background: #d69e2e; color: #1a202c; border-color: #b7791f; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8" onload="initSystem()">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6 rpg-box p-4">
        <h1 class="text-xl md:text-2xl text-yellow-500">📜 任務結算系統</h1>
        <div class="space-x-2">
            <button onclick="switchView('form')" class="rpg-btn">填寫區</button>
            <button onclick="showAdminLogin()" class="rpg-btn">管理後台</button>
        </div>
    </div>

    <!-- ================= 前台：動態問卷 ================= -->
    <div id="formView" class="max-w-2xl mx-auto rpg-box p-6">
        <div id="loadingForm" class="text-center py-10 animate-pulse text-yellow-400">系統連線中...讀取任務卷軸...</div>
        
        <form id="surveyForm" onsubmit="event.preventDefault(); submitDynamicForm();" class="hidden">
            <div id="step1" class="step-section active">
                <h2 class="text-xl text-blue-300 mb-4">▶ 第一章：冒險者身分確認</h2>
                <div id="dynamic-step1" class="space-y-4"></div>
                <div class="mt-8 flex justify-end"><button type="button" onclick="nextStep(2)" class="rpg-btn rpg-btn-primary">下一步 ➡</button></div>
            </div>
            <div id="step2" class="step-section">
                <h2 class="text-xl text-green-300 mb-4">▶ 第二章：任務結算評分</h2>
                <div id="dynamic-step2" class="space-y-6"></div>
                <div class="mt-8 flex justify-between"><button type="button" onclick="nextStep(1)" class="rpg-btn">⬅ 上一步</button><button type="button" onclick="nextStep(3)" class="rpg-btn rpg-btn-primary">下一步 ➡</button></div>
            </div>
            <div id="step3" class="step-section">
                <h2 class="text-xl text-purple-300 mb-4">▶ 最終章：留下您的冒險紀載</h2>
                <div id="dynamic-step3" class="space-y-4"></div>
                <div class="mt-8 flex justify-between"><button type="button" onclick="nextStep(2)" class="rpg-btn">⬅ 上一步</button><button type="submit" id="submitBtn" class="rpg-btn rpg-btn-primary bg-green-600">⚔️ 送出任務</button></div>
            </div>
            <div id="step4" class="step-section text-center py-10">
                <h2 class="text-3xl text-yellow-400 mb-4">QUEST CLEARED!</h2>
                <button type="button" onclick="location.reload()" class="rpg-btn">🔄 返回</button>
            </div>
        </form>
    </div>

    <!-- ================= 後台登入 ================= -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="rpg-box p-6 max-w-sm w-full mx-4">
            <h3 class="text-xl text-yellow-400 mb-4">🔒 解鎖管理者權限</h3>
            <input type="password" id="adminPwd" class="rpg-input mb-4" placeholder="密碼 (預設888)">
            <div class="flex justify-end space-x-2"><button onclick="document.getElementById('loginModal').classList.add('hidden')" class="rpg-btn">取消</button><button onclick="checkAdminPassword()" class="rpg-btn rpg-btn-primary">解鎖</button></div>
        </div>
    </div>

    <!-- ================= 後台：管理介面 ================= -->
    <div id="adminView" class="hidden max-w-6xl mx-auto">
        <!-- 後台選單 -->
        <div class="flex space-x-2 mb-4">
            <button onclick="switchAdminTab('dataTab')" class="rpg-btn bg-gray-700" id="btn-dataTab">📊 填寫紀錄與圖表</button>
            <button onclick="switchAdminTab('schemaTab')" class="rpg-btn" id="btn-schemaTab">🛠️ 欄位設計器</button>
        </div>

        <!-- 分頁 1：填寫紀錄 -->
        <div id="dataTab">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="rpg-box p-4 bg-white"><canvas id="ratingChart"></canvas></div>
                <div class="rpg-box p-4 bg-white"><canvas id="subjectChart"></canvas></div>
            </div>
            <div class="rpg-box p-4 overflow-x-auto">
                <h2 class="text-xl text-yellow-400 mb-4">📋 紀錄清單</h2>
                <table class="w-full text-left border-collapse min-w-max text-sm" id="dataTable">
                    <thead id="dataThead" class="border-b-2 border-gray-600 text-gray-400"></thead>
                    <tbody id="dataTbody"></tbody>
                </table>
            </div>
        </div>

        <!-- 分頁 2：欄位設計器 -->
        <div id="schemaTab" class="hidden">
            <div class="rpg-box p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl text-yellow-400">🛠️ 目前的問卷欄位</h2>
                    <button onclick="document.getElementById('addFieldModal').classList.remove('hidden')" class="rpg-btn rpg-btn-primary bg-green-600">+ 新增欄位</button>
                </div>
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="border-b border-gray-600 text-gray-400"><tr><th class="p-2">題目名稱</th><th class="p-2">放置步驟</th><th class="p-2">題型</th><th class="p-2">必填</th><th class="p-2">操作</th></tr></thead>
                    <tbody id="schemaTbody"></tbody>
                </table>
                <p class="text-gray-400 mt-4 text-xs">註：刪除欄位只會從問卷上隱藏，已經收集到的歷史資料仍保存在 Google 試算表中，保障資料安全。</p>
            </div>
        </div>
    </div>

    <!-- 新增欄位 Modal -->
    <div id="addFieldModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="rpg-box p-6 max-w-md w-full mx-4">
            <h3 class="text-xl text-yellow-400 mb-4">✨ 鍛造新題目</h3>
            <div class="space-y-3">
                <div><label class="block text-sm">題目名稱 (如：飲食偏好)</label><input type="text" id="newLabel" class="rpg-input"></div>
                <div class="flex space-x-2">
                    <div class="w-1/2"><label class="block text-sm">位置</label>
                        <select id="newStep" class="rpg-input"><option value="step1">第一章 (基本)</option><option value="step2">第二章 (評分)</option><option value="step3">最終章 (回饋)</option></select>
                    </div>
                    <div class="w-1/2"><label class="block text-sm">題型</label>
                        <select id="newType" class="rpg-input"><option value="text">簡答框</option><option value="select">下拉選單</option><option value="rating">1-5星評分</option><option value="textarea">多行文字</option></select>
                    </div>
                </div>
                <div><label class="block text-sm">下拉選項 (用半形逗號分隔，若非選單則免填)</label><input type="text" id="newOptions" class="rpg-input" placeholder="葷食,素食"></div>
                <div><label class="block text-sm">是否必填</label><select id="newReq" class="rpg-input"><option value="true">是</option><option value="false">否</option></select></div>
            </div>
            <div class="flex justify-end space-x-2 mt-6"><button onclick="document.getElementById('addFieldModal').classList.add('hidden')" class="rpg-btn">取消</button><button onclick="saveNewField()" id="saveFieldBtn" class="rpg-btn rpg-btn-primary">儲存</button></div>
        </div>
    </div>

    <!-- ================= JavaScript ================= -->
    <script>
        // ⚠️ 請填入您最新的 Apps Script 網址
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwindH0YbFK3TTdDcDe29L1FN95ZeTYpHQAxhS9LXxRHPjzZJwJW31qP8BRsLu3ThPJ/exec';
        let sysSchema = [], sysData = [];
        let chart1 = null, chart2 = null;

        // 初始化：向 GAS 索取 Schema 與 Data
        async function initSystem() {
            try {
                const res = await fetch(gasUrl);
                const json = await res.json();
                sysSchema = json.schema; sysData = json.data;
                renderDynamicForm();
                document.getElementById('loadingForm').classList.add('hidden');
                document.getElementById('surveyForm').classList.remove('hidden');
            } catch(e) { document.getElementById('loadingForm').innerText = "連線失敗，請確認 GAS 網址與權限。"; }
        }

        // 動態生成問卷介面
        function renderDynamicForm() {
            document.getElementById('dynamic-step1').innerHTML = '';
            document.getElementById('dynamic-step2').innerHTML = '';
            document.getElementById('dynamic-step3').innerHTML = '';

            sysSchema.forEach((q, idx) => {
                let html = '';
                let reqAttr = q['必填'] === 'true' || q['必填'] === true ? 'required' : '';
                let reqStar = reqAttr ? '<span class="text-red-500">*</span>' : '';
                let label = q['題目名稱'];

                if(q['題型'] === 'text') {
                    html = `<div><label class="block mb-1">${label} ${reqStar}</label><input type="text" name="${label}" class="rpg-input" ${reqAttr}></div>`;
                } else if(q['題型'] === 'textarea') {
                    html = `<div><label class="block mb-1">${label} ${reqStar}</label><textarea name="${label}" class="rpg-input h-24" ${reqAttr}></textarea></div>`;
                } else if(q['題型'] === 'select') {
                    let opts = q['選項'].split(',').map(o => `<option value="${o}">${o}</option>`).join('');
                    html = `<div><label class="block mb-1">${label} ${reqStar}</label><select name="${label}" class="rpg-input" ${reqAttr}><option value="">-- 請選擇 --</option>${opts}</select></div>`;
                } else if(q['題型'] === 'rating') {
                    html = `<div><label class="block mb-2">${label} ${reqStar}</label><div class="rating-group">
                        <input type="radio" id="r${idx}_1" name="${label}" value="1" ${reqAttr}><label for="r${idx}_1">1</label>
                        <input type="radio" id="r${idx}_2" name="${label}" value="2"><label for="r${idx}_2">2</label>
                        <input type="radio" id="r${idx}_3" name="${label}" value="3"><label for="r${idx}_3">3</label>
                        <input type="radio" id="r${idx}_4" name="${label}" value="4"><label for="r${idx}_4">4</label>
                        <input type="radio" id="r${idx}_5" name="${label}" value="5"><label for="r${idx}_5">5</label>
                    </div></div>`;
                }
                
                let target = document.getElementById('dynamic-' + q['步驟']);
                if(target) target.innerHTML += html;
            });
        }

        // 表單步驟切換
        function nextStep(step) {
            const form = document.getElementById('surveyForm');
            if(!form.reportValidity()) return; // 觸發 HTML5 原生驗證
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        // 動態送出表單
        async function submitDynamicForm() {
            const btn = document.getElementById('submitBtn'); btn.innerText = "⏳ 傳送中..."; btn.disabled = true;
            const formData = {};
            document.querySelectorAll('#surveyForm [name]').forEach(input => {
                if(input.type === 'radio' && !input.checked) return;
                formData[input.name] = input.value;
            });
            
            try {
                const res = await fetch(gasUrl, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({ action: 'submit_form', data: formData }) });
                if((await res.json()).result === 'success') {
                    document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
                    document.getElementById('step4').classList.add('active');
                }
            } catch(e) { alert("送出失敗"); btn.innerText = "⚔️ 送出任務"; btn.disabled = false; }
        }

        // ------------------ 後台管理功能 ------------------
        function switchView(view) {
            document.getElementById('formView').classList.add('hidden'); document.getElementById('adminView').classList.add('hidden');
            document.getElementById(view + 'View').classList.remove('hidden');
        }
        function showAdminLogin() { document.getElementById('loginModal').classList.remove('hidden'); }
        
        async function checkAdminPassword() {
            const pwd = document.getElementById('adminPwd').value;
            try {
                const res = await fetch(gasUrl, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({ action: 'verify_password', password: pwd }) });
                if ((await res.json()).status === 'success') {
                    document.getElementById('loginModal').classList.add('hidden'); switchView('admin');
                    renderAdminData(); renderSchemaTable();
                } else alert("密碼錯誤");
            } catch(e) { alert("連線失敗"); }
        }

        function switchAdminTab(tabId) {
            document.getElementById('dataTab').classList.add('hidden'); document.getElementById('schemaTab').classList.add('hidden');
            document.getElementById('btn-dataTab').classList.remove('bg-gray-700'); document.getElementById('btn-schemaTab').classList.remove('bg-gray-700');
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('bg-gray-700');
        }

        // 渲染欄位設計器列表
        function renderSchemaTable() {
            const tbody = document.getElementById('schemaTbody'); tbody.innerHTML = '';
            sysSchema.forEach(q => {
                tbody.innerHTML += `<tr class="border-b border-gray-700">
                    <td class="p-2 text-yellow-300">${q['題目名稱']}</td><td class="p-2">${q['步驟']}</td>
                    <td class="p-2">${q['題型']}</td><td class="p-2">${q['必填']==='true'?'是':'否'}</td>
                    <td class="p-2"><button onclick="deleteField('${q['題目名稱']}')" class="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-500">刪除</button></td>
                </tr>`;
            });
        }

        async function saveNewField() {
            const btn = document.getElementById('saveFieldBtn'); btn.disabled = true; btn.innerText = '儲存中...';
            const payload = {
                action: 'add_question', label: document.getElementById('newLabel').value, step: document.getElementById('newStep').value,
                type: document.getElementById('newType').value, options: document.getElementById('newOptions').value, required: document.getElementById('newReq').value
            };
            try {
                await fetch(gasUrl, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload) });
                alert("欄位新增成功！"); location.reload(); // 重整以抓取最新 Schema
            } catch(e) { alert("儲存失敗"); btn.disabled = false; btn.innerText = '儲存'; }
        }

        async function deleteField(label) {
            if(!confirm(`確定要刪除「${label}」嗎？這會從問卷中隱藏它。`)) return;
            try {
                await fetch(gasUrl, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({ action: 'delete_question', label: label }) });
                alert("刪除成功！"); location.reload();
            } catch(e) { alert("刪除失敗"); }
        }

        // 渲染資料表與圖表 (動態抓取 Rating 欄位畫圖)
        function renderAdminData() {
            if(sysData.length === 0) return;
            
            // 動態產生表格 Header
            const thead = document.getElementById('dataThead');
            const keys = Object.keys(sysData[0]).filter(k => k !== 'rowId');
            thead.innerHTML = `<tr>${keys.map(k => `<th class="p-2">${k}</th>`).join('')}</tr>`;
            
            // 產生表格 Data
            const tbody = document.getElementById('dataTbody');
            sysData.forEach(row => {
                let html = '<tr>';
                keys.forEach(k => {
                    let val = row[k];
                    if(k==='時間戳記' && val) val = new Date(val).toLocaleDateString('zh-TW');
                    html += `<td class="p-2 truncate max-w-[150px]" title="${val}">${val}</td>`;
                });
                html += '</tr>'; tbody.innerHTML += html;
            });

            // 尋找所有 rating 題型來畫圖
            const ratingQs = sysSchema.filter(q => q['題型'] === 'rating').map(q => q['題目名稱']);
            let ratingTotals = {}, ratingCounts = {};
            ratingQs.forEach(rq => { ratingTotals[rq] = 0; ratingCounts[rq] = 0; });
            
            sysData.forEach(row => {
                ratingQs.forEach(rq => {
                    let val = parseInt(row[rq]);
                    if(!isNaN(val)) { ratingTotals[rq] += val; ratingCounts[rq]++; }
                });
            });

            const avgData = ratingQs.map(rq => ratingCounts[rq] > 0 ? (ratingTotals[rq] / ratingCounts[rq]).toFixed(1) : 0);

            if(chart1) chart1.destroy();
            chart1 = new Chart(document.getElementById('ratingChart').getContext('2d'), {
                type: 'bar',
                data: { labels: ratingQs, datasets: [{ label: '平均滿意度', data: avgData, backgroundColor: ['#f6ad55', '#68d391', '#63b3ed', '#fc8181'] }] },
                options: { scales: { y: { beginAtZero: true, max: 5 } } }
            });
        }
    </script>
</body>
</html>
